<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Budsjett</title>
    <script>
      // Apply the saved look before the app loads, so there's no flash of the wrong theme.
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('budget.prefs') || '{}'); } catch (e) {}
        var t = p.theme === 'light' || p.theme === 'dark' ? p.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.dataset.theme = t;
        r.dataset.accent = p.accent || 'green';
        r.dataset.density = p.density || 'comfortable';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
